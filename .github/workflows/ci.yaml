name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Documentation-only changes skip the build and test jobs below. A skipped job
  # satisfies a required check, so every gated job runs unless this job positively
  # reported code=false: a failed or missing classification runs everything.
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          # A pull request merge commit or a squash-merged push, and its base HEAD^1.
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Classify changed paths
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          # A push of several commits at once is not described by HEAD^1; run everything.
          if [ "$EVENT_NAME" = push ] && [ "$(git rev-parse HEAD^1)" != "$PUSH_BEFORE" ]; then
            echo "code=true" | tee -a "$GITHUB_OUTPUT"
          else
            node tools/ci/docs-only.mjs HEAD^1 | tee -a "$GITHUB_OUTPUT"
          fi

  backend:
    name: backend
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify backend with PostgreSQL Testcontainers
        run: ./mvnw verify
      - name: Report backend coverage
        if: always()
        run: python3 ../tools/backend-coverage-summary.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/target/site/jacoco/
          retention-days: 14

  frontend:
    name: frontend
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify isolated demo tooling
        run: node --test ../tools/demo/*.test.mjs
      - name: Verify one-time Codespaces seed guards
        run: node --test ../.devcontainer/*.test.mjs
      - name: Verify Codespaces startup lifecycle and secret isolation
        run: python3 ../.devcontainer/test-start.py
      - name: Verify CI tooling
        run: node --test ../tools/ci/*.test.mjs
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  demo-tooling-windows:
    name: demo tooling (Windows)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Verify demo environment and process guardrails
        run: node --test tools/demo/*.test.mjs
      - name: Verify real Java cooperative shutdown and fixture acknowledgement
        working-directory: backend
        run: ./mvnw.cmd -B -Dtest=OfflineDemoShutdownTest test
      - name: Smoke-check Docker Compose discovery without a daemon
        run: node tools/demo/compose-smoke.mjs

  playground-browser:
    name: playground browser (${{ matrix.browser }})
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    # Keep one test worker per engine; isolate engines to fit the existing bound.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    # Match the pinned test package; browsers/OS libraries are preinstalled.
    # Avoid apt mirror stalls in playwright install --with-deps.
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          # The Mana A/B capture reads the exact merged #181 CSS from history.
          fetch-depth: 0
      - name: Trust browser checkout and verify comparison history
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git show 2e83ab5940bb865951132aeaa1969fc34a2dad42:frontend/src/playground/mana.css > /dev/null
          git diff --exit-code
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test:browser -- --project=${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playground-browser-evidence-${{ matrix.browser }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14
