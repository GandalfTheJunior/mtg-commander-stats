name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify backend with PostgreSQL Testcontainers
        run: ./mvnw verify

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify isolated demo tooling
        run: node --test ../tools/demo/*.test.mjs
      - name: Verify one-time Codespaces seed guards
        run: node --test ../.devcontainer/seed-demo.test.mjs
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  demo-tooling-windows:
    name: demo tooling (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Verify demo environment and process guardrails
        run: node --test tools/demo/*.test.mjs
      - name: Verify real Java cooperative shutdown and fixture acknowledgement
        working-directory: backend
        run: ./mvnw.cmd -B -Dtest=OfflineDemoShutdownTest test
      - name: Smoke-check Docker Compose discovery without a daemon
        run: node tools/demo/compose-smoke.mjs
