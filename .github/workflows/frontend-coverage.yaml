name: Frontend coverage

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read

jobs:
  frontend-coverage:
    name: frontend-coverage
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test:coverage-reporter
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-app-coverage
          path: frontend/coverage/app/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-playground-coverage
          path: frontend/coverage/playground/
          retention-days: 14
